name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare backend (.env + DB schema)
        run: |
          cp backend/.env.example backend/.env
          npm run db:push
      - run: npm test
      - run: npm run build
